[package]
name = "quillstone-player"
default-run = "quillstone-player"
description = "Windowed Quillstone player (winit + wgpu)"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tsarbomba/quillstone"
publish = false

# Standalone on purpose: the engine crates in ../crates have no dependencies and
# build anywhere; this one needs the GPU stack. To fold it into the main workspace,
# delete the [workspace] line, remove `exclude` in ../Cargo.toml and add "player"
# to `members`.
[workspace]

[features]
default = ["text", "audio", "video", "gamepad"]
# Text rendering with cosmic-text. Build with --no-default-features to get the
# window, images and panels without text (useful if only that part fails to compile).
text = ["dep:cosmic-text"]
# Music, sound effects and voice with kira. Without it the game runs silent.
audio = ["dep:kira", "dep:symphonia"]
# Video playback with FFmpeg, which also plays Opus sound files. Needs FFmpeg
# (8.x shared build) and libclang to build: see README.md. Without it, videos
# show a placeholder and Opus files don't play.
video = ["dep:ffmpeg-next"]
# Gamepads (Xbox, PlayStation, Switch Pro, Steam Deck...) with gilrs. On Linux it
# needs libudev's development files to build.
gamepad = ["dep:gilrs"]
# For shipping on Windows: no console window behind the game. Messages then go
# nowhere, except startup errors and crashes, which land in error.txt by the exe.
no-console = []

[dependencies]
quillstone-script = { path = "../crates/quillstone-script" }
quillstone-render = { path = "../crates/quillstone-render" }
quillstone-audio = { path = "../crates/quillstone-audio" }
quillstone-ui = { path = "../crates/quillstone-ui" }
quillstone-video = { path = "../crates/quillstone-video" }
ffmpeg-next = { version = "9", optional = true, default-features = false, features = ["codec", "format", "software-scaling"] }

wgpu = "30"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
cosmic-text = { version = "0.19", optional = true }
kira = { version = "0.12", optional = true, default-features = false, features = ["cpal", "ogg", "vorbis", "wav", "mp3", "flac"] }
# Only for its `MediaSource` trait, which kira's decoders take (same version and features as kira's own).
symphonia = { version = "0.6", optional = true, default-features = false }
gilrs = { version = "0.11", optional = true }
# Ctrl+V at a text input (winit has no clipboard). No image support: text only.
arboard = { version = "3", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[profile.release]
# Whole-program optimisation: about 19% smaller than thin LTO at no run-time cost; release builds take ~2x longer.
lto = "fat"
codegen-units = 1

[dev-dependencies]
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
