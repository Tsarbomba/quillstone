name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # builds the kits and keeps them as workflow artifacts, no release

permissions:
  contents: read

jobs:
  build:
    name: Kit for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            exe: .exe
          # 22.04 on purpose: the kit runs on any distro with glibc 2.35 or newer.
          - os: linux
            runner: ubuntu-22.04
            exe: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Third-party actions are pinned to a commit: a moved tag can't change what runs.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            player -> target

      - name: Install build dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev pkg-config clang libclang-dev nasm

      - name: Find LLVM (Windows)
        if: matrix.os == 'windows'
        run: |
          # The runner image ships LLVM; install it only if that ever changes.
          [ -f "C:/Program Files/LLVM/bin/libclang.dll" ] || choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      # Our own slim LGPL FFmpeg (tools/build-ffmpeg.sh); rebuilt only when the script changes.
      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v6
        with:
          path: ffmpeg-slim
          key: ffmpeg-slim-${{ runner.os }}-${{ hashFiles('tools/build-ffmpeg.sh') }}

      - name: Set up MSYS2 (Windows)
        if: matrix.os == 'windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: curl make diffutils tar xz mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm

      - name: Build FFmpeg (Windows)
        if: matrix.os == 'windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: tools/build-ffmpeg.sh ffmpeg-slim

      - name: Build FFmpeg (Linux)
        if: matrix.os == 'linux' && steps.ffmpeg.outputs.cache-hit != 'true'
        run: tools/build-ffmpeg.sh ffmpeg-slim

      - name: Point the build at FFmpeg
        run: |
          here=$(pwd -W 2>/dev/null || pwd) # Windows-style path for cargo
          echo "FFMPEG_DIR=$here/ffmpeg-slim" >> "$GITHUB_ENV"

      - name: Build the command line tool
        run: cargo build --release -p quillstone

      - name: Build the player
        working-directory: player
        run: cargo build --release --features no-console

      - name: Assemble the kit
        id: kit
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="${GITHUB_SHA::7}"; fi
          name="quillstone-$version-${{ matrix.os }}"
          kit="$RUNNER_TEMP/$name"
          mkdir -p "$kit/licenses"
          cp "target/release/quillstone${{ matrix.exe }}" "player/target/release/quillstone-player${{ matrix.exe }}" "$kit/"
          if [ "${{ matrix.os }}" = windows ]; then
            for lib in avcodec avformat avutil swscale swresample; do cp "$FFMPEG_DIR"/bin/$lib-*.dll "$kit/"; done
          else
            # cp -a keeps the libavcodec.so -> .so.62 -> .so.62.x links the player's rpath ($ORIGIN) relies on
            for lib in avcodec avformat avutil swscale swresample; do cp -a "$FFMPEG_DIR"/lib/lib$lib.so* "$kit/"; done
          fi
          cp -r examples "$kit/examples"
          cp README.md SCRIPT.md "$kit/"
          cp LICENSE-MIT LICENSE-APACHE "$kit/licenses/"

          # Smoke test: package the demo with the kit's own tools (the player is found beside quillstone).
          # --libs points at FFmpeg's own folder so the notice includes its LGPL text (LICENSE.txt beside it).
          libs="$FFMPEG_DIR/${{ matrix.os == 'windows' && 'bin' || 'lib' }}"
          "$kit/quillstone${{ matrix.exe }}" package examples/demo.quill.md --out "$RUNNER_TEMP/smoke" --libs "$libs"
          # licenses/FFmpeg.txt: where the libraries' source is, then package's notice with the LGPL text.
          # Games packaged from the kit copy this file as it is.
          ver=$(sed -n 's/^FFMPEG_VERSION=${FFMPEG_VERSION:-\(.*\)}$/\1/p' tools/build-ffmpeg.sh)
          sha=$(sed -n 's/.*FFMPEG_SHA256:-\([0-9a-f]*\)}$/\1/p' tools/build-ffmpeg.sh)
          {
            cat <<EOF
          The FFmpeg libraries (avcodec, avformat, avutil, swscale, swresample) were built from the
          unmodified FFmpeg $ver source, a slim build with only VP8/VP9, Vorbis, Opus, WebM/Matroska
          and Ogg:
            https://ffmpeg.org/releases/ffmpeg-$ver.tar.xz
            (sha256 $sha)
          The configure options and build steps are in tools/build-ffmpeg.sh:
            https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/tools/build-ffmpeg.sh

          EOF
            cat "$RUNNER_TEMP/smoke/licenses/FFmpeg.txt"
          } > "$kit/licenses/FFmpeg.txt"
          grep -q "licence text that came with" "$kit/licenses/FFmpeg.txt" || { echo "LGPL text missing"; exit 1; }

          cd "$RUNNER_TEMP"
          if [ "${{ matrix.os }}" = windows ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null # one folder inside, named like the archive
            echo "file=$RUNNER_TEMP/$name.zip" >> "$GITHUB_OUTPUT"
          else
            # The player must find FFmpeg beside itself, with no LD_LIBRARY_PATH.
            if ldd "$kit/quillstone-player" | grep "not found"; then echo "player has unresolved libraries"; exit 1; fi
            tar czf "$name.tar.gz" "$name" # one folder inside, named like the archive
            echo "file=$RUNNER_TEMP/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.kit.outputs.file }}
          archive: false # the artifact is the kit file itself, named after it
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: quillstone-*
          path: kits
          merge-multiple: true
          skip-decompress: true # keep the .zip a zip
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: kits/*
          generate_release_notes: true
