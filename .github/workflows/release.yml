name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # builds the kits and keeps them as workflow artifacts, no release

permissions:
  contents: read

jobs:
  build:
    name: Kit for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            exe: .exe
            ffmpeg: ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip
          # 22.04 on purpose: the kit runs on any distro with glibc 2.35 or newer.
          - os: linux
            runner: ubuntu-22.04
            exe: ""
            ffmpeg: ffmpeg-n8.1-latest-linux64-lgpl-shared-8.1.tar.xz
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            player -> target

      - name: Install build dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev pkg-config clang libclang-dev

      - name: Find LLVM (Windows)
        if: matrix.os == 'windows'
        run: |
          # The runner image ships LLVM; install it only if that ever changes.
          [ -f "C:/Program Files/LLVM/bin/libclang.dll" ] || choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Download FFmpeg 8.1 (LGPL, shared)
        run: |
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          mkdir -p "$RUNNER_TEMP/ffmpeg-dl"
          cd "$RUNNER_TEMP/ffmpeg-dl"
          curl -fsSL -O "$base/${{ matrix.ffmpeg }}"
          sha256sum "${{ matrix.ffmpeg }}" | tee ffmpeg.sha256
          if [ "${{ matrix.os }}" = windows ]; then 7z x -y "${{ matrix.ffmpeg }}" >/dev/null; else tar xf "${{ matrix.ffmpeg }}"; fi
          dir=$(echo ffmpeg-n8.1-latest-*-lgpl-shared-8.1)
          [ -d "$dir/lib" ] || { echo "unexpected FFmpeg archive layout"; ls; exit 1; }
          here=$(pwd -W 2>/dev/null || pwd) # Windows-style path for cargo
          echo "FFMPEG_DIR=$here/$dir" >> "$GITHUB_ENV"
          echo "FFMPEG_SHA256=$(cut -d' ' -f1 ffmpeg.sha256)" >> "$GITHUB_ENV"

      - name: Build the command line tool
        run: cargo build --release -p quillstone

      - name: Build the player
        working-directory: player
        run: cargo build --release --features no-console

      - name: Assemble the kit
        id: kit
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="${GITHUB_SHA::7}"; fi
          name="quillstone-$version-${{ matrix.os }}"
          kit="$RUNNER_TEMP/$name"
          mkdir -p "$kit/licenses"
          cp "target/release/quillstone${{ matrix.exe }}" "player/target/release/quillstone-player${{ matrix.exe }}" "$kit/"
          if [ "${{ matrix.os }}" = windows ]; then
            for lib in avcodec avformat avutil swscale swresample; do cp "$FFMPEG_DIR"/bin/$lib-*.dll "$kit/"; done
          else
            # cp -a keeps the libavcodec.so -> .so.62 -> .so.62.x links the player's rpath ($ORIGIN) relies on
            for lib in avcodec avformat avutil swscale swresample; do cp -a "$FFMPEG_DIR"/lib/lib$lib.so* "$kit/"; done
          fi
          cp -r examples "$kit/examples"
          cp README.md SCRIPT.md "$kit/"
          cp LICENSE-MIT LICENSE-APACHE "$kit/licenses/"

          # Smoke test: package the demo with the kit's own tools (the player is found beside quillstone).
          # --libs points at FFmpeg's own folder so the notice includes its LGPL text.
          libs="$FFMPEG_DIR/${{ matrix.os == 'windows' && 'bin' || 'lib' }}"
          "$kit/quillstone${{ matrix.exe }}" package examples/demo.quill.md --out "$RUNNER_TEMP/smoke" --libs "$libs"
          cp "$RUNNER_TEMP/smoke/licenses/FFmpeg.txt" "$kit/licenses/FFmpeg.txt"
          grep -q "licence text that came with" "$kit/licenses/FFmpeg.txt" || { echo "LGPL text missing"; exit 1; }

          cat > "$kit/FFMPEG-SOURCE.txt" <<EOF
          This kit includes the FFmpeg shared libraries avcodec, avformat, avutil, swscale and
          swresample, licensed under the GNU LGPL version 2.1 or later (see licenses/FFmpeg.txt).
          They are unmodified FFmpeg 8.1 binaries from the BtbN FFmpeg-Builds project,
          file ${{ matrix.ffmpeg }}
          (sha256 $FFMPEG_SHA256).

          FFmpeg's source code: https://ffmpeg.org/download.html (release 8.1, git tag n8.1)
          How these binaries were built: https://github.com/BtbN/FFmpeg-Builds

          You may replace the library files with other builds of the same FFmpeg version.
          EOF

          cd "$RUNNER_TEMP"
          if [ "${{ matrix.os }}" = windows ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            echo "file=$RUNNER_TEMP/$name.zip" >> "$GITHUB_OUTPUT"
          else
            # The player must find FFmpeg beside itself, with no LD_LIBRARY_PATH.
            if ldd "$kit/quillstone-player" | grep "not found"; then echo "player has unresolved libraries"; exit 1; fi
            tar czf "$name.tar.gz" "$name"
            echo "file=$RUNNER_TEMP/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kit-${{ matrix.os }}
          path: ${{ steps.kit.outputs.file }}
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kit-*
          path: kits
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: kits/*
          generate_release_notes: true
